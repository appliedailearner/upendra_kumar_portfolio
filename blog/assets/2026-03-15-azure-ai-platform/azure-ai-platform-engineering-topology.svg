  <rect class="card" x="262" y="380" width="148" height="42"/><text class="ct" x="278" y="404">apim-ai-prod-uaen-01</text><text class="cs" x="278" y="416">API Management</text>
  <rect class="card" x="424" y="380" width="250" height="42"/><text class="ct" x="440" y="404">app-ai-orch-prod-uaen-01</text><text class="cs" x="440" y="416">App Service / AI orchestrator</text>
  <rect class="card" x="84" y="438" width="138" height="24"/><text class="ct" x="100" y="454">srch-ai-prod-uaen-01</text>
  <rect class="card" x="232" y="438" width="170" height="24"/><text class="ct" x="248" y="454">oai-gpt4o-prod-uaen-01</text>
