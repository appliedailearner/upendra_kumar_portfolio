  <rect class="pilldr" x="764" y="340" width="138" height="22"/><text class="tiny" x="776" y="355">snet-appgw-ukc-01 | 10.20.1.0/24</text>
  <rect class="pilldr" x="912" y="340" width="138" height="22"/><text class="tiny" x="924" y="355">snet-apim-ukc-01 | 10.20.2.0/24</text>
