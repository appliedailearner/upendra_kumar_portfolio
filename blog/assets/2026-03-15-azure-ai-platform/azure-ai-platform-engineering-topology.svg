      .flow{stroke:#2b579a;stroke-width:2.5;fill:none;marker-end:url(#b)}.flowdr{stroke:#5e9732;stroke-width:2.5;fill:none;marker-end:url(#g)}.mg{stroke:#7b7b7b;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#n)}.peer{stroke:#7a7a7a;stroke-width:1.7;fill:none;stroke-dasharray:6 5}
    </style>
