<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280" role="img" aria-labelledby="t d">
  <title id="t">Azure AI Platform Engineering Topology</title>
  <desc id="d">Engineering topology for a multi-region Azure AI platform showing management groups, subscriptions, VNets, subnets, shared services, hub-spoke connectivity, and DR patterns.</desc>
