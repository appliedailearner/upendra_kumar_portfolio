  <rect class="card" x="400" y="132" width="98" height="30"/><text class="ct" x="426" y="151">mg-prod</text>
  <rect class="card" x="516" y="132" width="114" height="30"/><text class="ct" x="540" y="151">mg-nonprod</text>
  <rect class="card" x="742" y="124" width="152" height="40"/><text class="ct" x="762" y="146">sub-connectivity-01</text><text class="cs" x="762" y="158">hub routing and shared network</text>
  <rect class="card" x="910" y="124" width="146" height="40"/><text class="ct" x="930" y="146">sub-security-01</text><text class="cs" x="930" y="158">central policy and SOC</text>
  <rect class="card" x="1072" y="124" width="176" height="40"/><text class="ct" x="1092" y="146">sub-sharedservices-01</text><text class="cs" x="1092" y="158">dns, kv, logs, insights</text>
  <rect class="card" x="1264" y="124" width="144" height="40"/><text class="ct" x="1284" y="146">sub-prod-ai-01</text><text class="cs" x="1284" y="158">production AI workload</text>
  <rect class="card" x="1424" y="124" width="162" height="40"/><text class="ct" x="1444" y="146">sub-nonprod-ai-01</text><text class="cs" x="1444" y="158">dev and test landing zone</text>

  <rect class="lane" x="20" y="202" width="1860" height="320"/>
  <text class="sec" x="38" y="232">2. Production AI landing zone</text>
  <rect class="sub" x="44" y="248" width="1360" height="252"/><rect class="head" x="44" y="248" width="1360" height="32"/><text class="hw" x="60" y="268">sub-prod-ai-01 | Regional workload spokes</text>
