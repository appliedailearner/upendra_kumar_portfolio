  <rect class="pilldr" x="1200" y="340" width="138" height="22"/><text class="tiny" x="1212" y="355">snet-pe-ukc-01 | 10.20.4.0/24</text>
  <rect class="carddr" x="764" y="380" width="164" height="42"/><text class="ct" x="780" y="404">agw-ai-prod-ukc-01</text><text class="cs" x="780" y="416">Application Gateway + WAF</text>
  <rect class="carddr" x="942" y="380" width="148" height="42"/><text class="ct" x="958" y="404">apim-ai-prod-ukc-01</text><text class="cs" x="958" y="416">API Management</text>
  <rect class="carddr" x="1104" y="380" width="250" height="42"/><text class="ct" x="1120" y="404">app-ai-orch-prod-ukc-01</text><text class="cs" x="1120" y="416">App Service / AI orchestrator</text>
  <rect class="carddr" x="764" y="438" width="130" height="24"/><text class="ct" x="780" y="454">srch-ai-dr-ukc-01</text>
  <rect class="carddr" x="904" y="438" width="170" height="24"/><text class="ct" x="920" y="454">oai-gpt4o-dr-ukc-01</text>
  <rect class="carddr" x="1084" y="438" width="130" height="24"/><text class="ct" x="1100" y="454">di-ai-dr-ukc-01</text>
