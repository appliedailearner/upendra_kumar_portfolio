  <rect class="bg" x="0" y="0" width="1900" height="1280"/>
  <text class="title" x="28" y="42">Azure AI Platform Engineering Topology</text>
  <text class="subt" x="28" y="66">Deployment view with management groups, subscriptions, VNets, subnets, hub-spoke controls, and DR service placement</text>

