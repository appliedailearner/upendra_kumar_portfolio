  <rect class="card" x="1450" y="316" width="386" height="50"/><text class="ct" x="1468" y="340">rg-ai-nonprod-uaen-01 | vnet-ai-nonprod-uaen-01</text><text class="cs" x="1468" y="354">Separate lower-cost stack and distinct policy boundary</text>
  <rect class="card" x="1450" y="384" width="386" height="50"/><text class="ct" x="1468" y="408">Dev / test API mediation, prompt iteration, search validation</text><text class="cs" x="1468" y="422">No production data path</text>

  <rect class="lane" x="20" y="538" width="1860" height="176"/>
  <text class="sec" x="38" y="568">3. Shared services and security control plane</text>
  <rect class="sub" x="44" y="584" width="938" height="106"/><rect class="head" x="44" y="584" width="938" height="30"/><text class="hw" x="60" y="603">sub-sharedservices-01</text>
  <rect class="card" x="66" y="628" width="192" height="32"/><text class="ct" x="82" y="649">kv-shared-uaen-01 / kv-shared-ukc-01</text>
  <rect class="card" x="272" y="628" width="160" height="32"/><text class="ct" x="288" y="649">Private DNS zones</text>
  <rect class="card" x="446" y="628" width="118" height="32"/><text class="ct" x="462" y="649">law-shared-01</text>
  <rect class="card" x="578" y="628" width="136" height="32"/><text class="ct" x="594" y="649">appi-ai-prod-01</text>
  <rect class="card" x="728" y="628" width="230" height="32"/><text class="ct" x="744" y="649">Recovery orchestration and backup notes</text>
  <rect class="gov" x="1006" y="584" width="852" height="106"/>
  <text class="subsec" x="1024" y="610">sub-security-01 | rg-security-platform-01</text>
  <rect class="card" x="1024" y="628" width="170" height="32"/><text class="ct" x="1040" y="649">Defender for Cloud</text>
  <rect class="card" x="1208" y="628" width="132" height="32"/><text class="ct" x="1224" y="649">Microsoft Sentinel</text>
  <rect class="card" x="1354" y="628" width="110" height="32"/><text class="ct" x="1386" y="649">RBAC</text>
  <rect class="card" x="1478" y="628" width="144" height="32"/><text class="ct" x="1494" y="649">Policy assignments</text>
  <rect class="card" x="1636" y="628" width="110" height="32"/><text class="ct" x="1652" y="649">DDoS Network</text>

  <rect class="lane" x="20" y="730" width="1860" height="222"/>
  <text class="sec" x="38" y="760">4. Connectivity hubs and private resolution path</text>
  <rect class="sub" x="44" y="776" width="1814" height="154"/><rect class="head" x="44" y="776" width="1814" height="32"/><text class="hw" x="60" y="796">sub-connectivity-01 | Hub-spoke networking and private endpoint resolution</text>
  <rect class="hub" x="66" y="826" width="852" height="86"/><text class="subsec" x="84" y="850">UAE North hub | vnet-hub-uaen-01 | 10.0.0.0/16</text>
  <rect class="card" x="84" y="866" width="160" height="24"/><text class="ct" x="100" y="882">AzureFirewallSubnet | 10.0.1.0/24</text>
  <rect class="card" x="256" y="866" width="160" height="24"/><text class="ct" x="272" y="882">AzureBastionSubnet | 10.0.2.0/24</text>
  <rect class="card" x="428" y="866" width="144" height="24"/><text class="ct" x="444" y="882">GatewaySubnet | 10.0.3.0/24</text>
  <rect class="card" x="584" y="866" width="170" height="24"/><text class="ct" x="600" y="882">snet-dnspr-uaen-01 | 10.0.4.0/24</text>
  <rect class="card" x="766" y="866" width="132" height="24"/><text class="ct" x="782" y="882">afw / ergw / dnspr</text>
  <rect class="hub" x="940" y="826" width="896" height="86"/><text class="subsec" x="958" y="850">UK Central hub | vnet-hub-ukc-01 | 10.100.0.0/16</text>
  <rect class="carddr" x="958" y="866" width="170" height="24"/><text class="ct" x="974" y="882">AzureFirewallSubnet | 10.100.1.0/24</text>
  <rect class="carddr" x="1140" y="866" width="170" height="24"/><text class="ct" x="1156" y="882">AzureBastionSubnet | 10.100.2.0/24</text>
  <rect class="carddr" x="1322" y="866" width="154" height="24"/><text class="ct" x="1338" y="882">GatewaySubnet | 10.100.3.0/24</text>
  <rect class="carddr" x="1488" y="866" width="170" height="24"/><text class="ct" x="1504" y="882">snet-dnspr-ukc-01 | 10.100.4.0/24</text>
  <rect class="carddr" x="1670" y="866" width="146" height="24"/><text class="ct" x="1686" y="882">afw / ergw / dnspr</text>

  <rect class="lane" x="20" y="968" width="1860" height="176"/>
  <text class="sec" x="38" y="998">5. Required flows and DR pattern</text>
  <rect class="card" x="66" y="1030" width="420" height="82"/><text class="ct" x="82" y="1056">Request path</text><text class="cs" x="82" y="1078">Users → Traffic Manager → App Gateway → APIM → Orchestrator</text><text class="cs" x="82" y="1096">Regional failover to UK Central through Traffic Manager</text>
  <rect class="card" x="508" y="1030" width="438" height="82"/><text class="ct" x="524" y="1056">RAG and ingestion</text><text class="cs" x="524" y="1078">Orchestrator → AI Search → GPT-4o → response</text><text class="cs" x="524" y="1096">Storage → Document Intelligence → chunking / indexing → Search</text>
  <rect class="card" x="968" y="1030" width="420" height="82"/><text class="ct" x="984" y="1056">Private networking path</text><text class="cs" x="984" y="1078">Spoke → Hub → Firewall / DNS Private Resolver → private endpoints</text><text class="cs" x="984" y="1096">Managed identity → Key Vault</text>
  <rect class="carddr" x="1410" y="1030" width="426" height="82"/><text class="ct" x="1426" y="1056">DR operating options</text><text class="cs" x="1426" y="1078">Option A: warm DR model deployment in UK Central</text><text class="cs" x="1426" y="1096">Option B: degraded DR without GPT inference</text>

  <path class="flow" d="M166 422 L262 422"/><path class="flow" d="M410 422 L424 401"/><path class="flow" d="M549 422 C549 438 153 438 153 438"/><path class="flow" d="M549 422 C549 438 317 438 317 438"/>
  <path class="flowdr" d="M846 422 L942 422"/><path class="flowdr" d="M1090 422 L1104 401"/><path class="flowdr" d="M1229 422 C1229 438 829 438 829 438"/><path class="flowdr" d="M1229 422 C1229 438 989 438 989 438"/>
  <path class="mg" d="M549 422 C549 640 670 640 670 866"/><path class="mg" d="M1229 422 C1229 640 1570 640 1570 866"/><path class="mg" d="M549 422 C549 610 162 610 162 628"/>
  <path class="peer" d="M720 401 L746 401"/><path class="peer" d="M918 878 L940 878"/>

  <rect class="gov" x="20" y="1160" width="1860" height="96"/>
  <text class="sec" x="38" y="1190">6. Implementation notes</text>
  <text class="cs" x="60" y="1218">1. Traffic Manager is current-state only; Front Door remains future-state.</text>
  <text class="cs" x="60" y="1236">2. APIM multi-region behavior must be validated against the intended Premium deployment model.</text>
  <text class="cs" x="960" y="1218">3. GPT-4o PTU is anchored in UAE North; UK Central must be explicitly warm DR or degraded DR.</text>
  <text class="cs" x="960" y="1236">4. AI Search, storage replication, custom DI models, private DNS, and secrets resolution require DR runbooks.</text>
</svg>
