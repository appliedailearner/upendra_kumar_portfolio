    - heading "1. The Shifting Paradigm" [level=2] [ref=e79]
    - paragraph [ref=e81]:
      - text: "For decades, the standard playbook for cloud resilience was simple:"
      - strong [ref=e82]: Region A + Region B = Safe.
      - text: We assumed that distance was the ultimate shield. But the reality of modern cloud architecture is more nuanced. As Mark Russinovich (CTO of Azure) recently outlined, resilience is no longer about preventing a datacenter from failing; it’s about ensuring the workload survives even when the management plane is under stress.
    - paragraph [ref=e83]: The "No-BS" truth? Regional pairing is a relic. If your failover relies on a manual VNet cutover that takes 4 hours, you don't have a resilience strategy—you have a documented catastrophe.
