        - paragraph [ref=e504]: Gray failures occur when a component (like a secondary NIC or a specific disk cluster) degrades but doesn't actually "die." Standard load balancer probes miss this, continuing to send traffic to a "Black Hole." Project Flash enables us to trigger an automatic regional switch *before* the user feels the impact.
