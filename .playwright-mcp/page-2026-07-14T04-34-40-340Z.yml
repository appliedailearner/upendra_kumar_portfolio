    - paragraph [ref=e116]:
      - text: At the strategic enterprise level, we are moving the goalposts. High Availability (HA) used to be an "add-on." Now, Multi-AZ is the baseline requirement. Availability Zones (AZs) are now treated as the primary region. We hedge against catastrophic, cross-zone failure with regional BCDR, but we run the business
