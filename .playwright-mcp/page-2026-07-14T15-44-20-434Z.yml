          - text: Strategic Alignment & ROI
        - heading "Executive Impact Summary" [level=2] [ref=f370e76]
      - generic [ref=f370e77]:
        - generic [ref=f370e78]:
          - generic [ref=f370e79]: 
          - generic [ref=f370e81]: 
          - heading "The Business Problem" [level=4] [ref=f370e83]
          - paragraph [ref=f370e84]: Agentic AI pilots stall in security review because every agent runs under a shared service principal with standing production access. When one agent misbehaves or gets compromised, the blast radius isn't one API call — it's every system that credential can reach. Auditors can't tell which agent did what, and the CISO won't sign off.
        - generic [ref=f370e85]:
          - generic [ref=f370e86]: 
          - generic [ref=f370e88]: 
          - heading "The Strategic Play" [level=4] [ref=f370e90]
          - paragraph [ref=f370e91]: Retire the shared service principal. Give every agent its own workload identity (Microsoft Entra Agent ID), route every call through an API Mediation Layer, and grant just-in-time, scoped permissions instead of standing RBAC roles. Every agent gets its own identity, its own audit trail, and access that expires the moment the task ends.
        - generic [ref=f370e92]:
          - generic [ref=f370e93]: 
          - generic [ref=f370e95]: 
          - heading "The Executive ROI" [level=4] [ref=f370e97]
          - paragraph [ref=f370e98]: Zero standing privilege collapses an agent's effective blast radius from every downstream system it could reach to the one scoped permission it actually used for that task. That turns a security review into auditing one narrow, provable claim per agent instead of reverse-engineering what a shared credential could theoretically touch — and it turns incident containment into rotating one token instead of every credential the compromised service could have used.
    - heading "The Standing Privilege Problem" [level=2] [ref=f370e99]
    - paragraph [ref=f370e101]:
      - text: Here's how almost every agentic AI pilot gets built. Someone needs the agent to read from Azure AI Search, call Azure OpenAI, write results to a database, and maybe kick off a downstream workflow. Under deadline pressure, the fastest path is one service principal, one client secret, and a role assignment broad enough that nobody has to come back and ask for more access later —
      - code [ref=f370e102]: Contributor
      - text: on the resource group, or worse, the subscription.
    - paragraph [ref=f370e103]: "It works. The demo ships. And then it goes to security review, where three questions kill the timeline every time:"
    - list [ref=f370e104]:
      - listitem [ref=f370e105]:
        - strong [ref=f370e106]: "\"Which agent did this?\""
        - text: Every action in the logs shows the same generic identity —
        - code [ref=f370e107]: svc-ai-agent-prod
        - text: — whether it was Agent A summarizing a contract or Agent B deleting a stale record. There is no per-agent audit trail.
      - listitem [ref=f370e108]:
        - strong [ref=f370e109]: "\"What's the blast radius if this credential leaks?\""
        - text: "The honest answer is: everything that service principal can touch. Not the one API the agent actually needed — every system the team was ever lazy enough to grant it."
      - listitem [ref=f370e110]:
        - strong [ref=f370e111]: "\"How do you revoke just this agent?\""
        - text: You can't, without breaking every other agent sharing the same identity. The only lever is "rotate the secret and redeploy everything," which nobody wants to do mid-incident.
    - generic [ref=f370e112]:
      - heading "Composite Scenario" [level=4] [ref=f370e113]
      - paragraph [ref=f370e114]: The following is a composite, illustrative walkthrough representative of a pattern seen repeatedly across regulated-industry agentic AI pilots — not a specific client engagement.
      - list [ref=f370e115]:
        - listitem [ref=f370e116]:
          - strong [ref=f370e117]: "Fictional Company:"
          - text: Solstice Underwriting
        - listitem [ref=f370e118]:
          - strong [ref=f370e119]: "The Agent:"
          - text: "\"ClaimAssist\" — reads policy documents and drafts adjuster recommendations"
        - listitem [ref=f370e120]:
          - strong [ref=f370e121]: "The Security Architect:"
          - text: designed the pilot's identity model
        - listitem [ref=f370e122]:
          - strong [ref=f370e123]: "The CISO:"
          - text: blocked the launch at review
    - paragraph [ref=f370e124]:
      - text: ClaimAssist shipped in three weeks. One app registration, one client secret in Key Vault,
      - code [ref=f370e125]: Contributor
      - text: on the resource group so nobody had to file a change request every time the pilot needed to touch a new storage container. In the demo, it read a claim file, cross-referenced the policy, and drafted a recommendation in under ten seconds. Leadership loved it.
    - paragraph [ref=f370e126]:
      - text: Then it went to the CISO for launch sign-off, and the review asked the same three questions every review asks. Which agent instance touched this specific claim file — the logs said
      - code [ref=f370e127]: svc-claimassist-prod
      - text: ", which was true of every instance running that week. What could the credential reach if it leaked — the honest answer was every storage account and every Cosmos DB container in the resource group, not just the claims data ClaimAssist was built to touch. How do you shut off just this one instance without breaking the other four running in parallel — nobody had an answer that didn't involve a maintenance window."
    - paragraph [ref=f370e128]:
      - text: "The fix wasn't a new model or a smarter prompt. The security architect rebuilt the identity layer: each ClaimAssist instance got its own workload identity, every downstream call moved behind an API Mediation Layer, and the broad"
      - code [ref=f370e129]: Contributor
      - text: role was replaced with a JIT-eligible role scoped to exactly the claims container that instance was assigned. Six weeks later the same pilot went back to the CISO. Same agent, same model, same prompts — but this time every question had a one-line, log-backed answer, and it cleared review.
    - paragraph [ref=f370e130]: None of this is a model problem. GPT-4, Claude, or whatever LLM is doing the reasoning is not the risk. The risk is the plumbing underneath it — the fact that most agentic AI architectures were built by borrowing the identity pattern from a 2015-era backend service, not designed for a fleet of autonomous actors that can each take independent action.
    - generic [ref=f370e131]:
      - 'heading "Architect''s Corner: A Badge vs. a Master Key" [level=3] [ref=f370e132]'
      - generic [ref=f370e133]:
        - generic [ref=f370e134]:
          - 'heading " The Legacy: One Master Key" [level=5] [ref=f370e135]':
            - generic [ref=f370e136]: 
            - text: "The Legacy: One Master Key"
          - paragraph [ref=f370e137]: A shared service principal is a master key handed to every contractor on a building site. It opens every door, all day, every day — because cutting a new key for each contractor felt like too much overhead.
          - list [ref=f370e138]:
            - listitem [ref=f370e139]:
              - generic [ref=f370e140]: 
              - text: Lose the key, and every door on the site is compromised — not just the one the contractor was supposed to be in.
            - listitem [ref=f370e141]:
              - generic [ref=f370e142]: 
              - text: The security log just says "master key used." It never says which contractor, or which door.
        - generic [ref=f370e143]:
          - 'heading " Zero Standing Privilege: A Badge" [level=5] [ref=f370e144]':
            - generic [ref=f370e145]: 
            - text: "Zero Standing Privilege: A Badge"
          - paragraph [ref=f370e146]: A per-agent workload identity is a badge that only opens the specific doors that agent needs, only while it's clocked in for that specific task, and logs the exact person and door every single time.
          - list [ref=f370e147]:
            - listitem [ref=f370e148]:
              - generic [ref=f370e149]: 
              - text: Lose one badge, and exactly one contractor's access is revoked. Everyone else keeps working.
            - listitem [ref=f370e150]:
              - generic [ref=f370e151]: 
              - text: The security log names the person, the door, and the minute. That's what a regulator actually wants to see.
    - 'heading "The Architecture: Per-Agent Identity, Not Per-Application" [level=2] [ref=f370e152]'
    - paragraph [ref=f370e154]: The fix isn't a new product — it's a different default. Instead of one identity per application (or worse, per environment), every agent instance gets its own workload identity, and every call it makes is forced through a mediation layer that enforces scope before anything reaches a backend system.
    - generic [ref=f370e155]:
      - heading "Per-Agent Identity Through the API Mediation Layer" [level=4] [ref=f370e156]
      - 'img "Architecture diagram: AI agent identity flowing through an API Mediation Layer with managed identity, scoped routing to Azure AI Search and Azure OpenAI, and auditable logs"'
      - paragraph [ref=f370e157]:
        - generic [ref=f370e158]: 
        - text: Every agent request carries its own identity through the mediation layer. The gateway — not the agent — holds the managed identity that talks to backend services, so no agent ever sees a raw connection string or API key. Every hop is logged against the agent that made it.
    - paragraph [ref=f370e159]: "Three things make this different from a normal API gateway pattern:"
    - list [ref=f370e160]:
      - listitem [ref=f370e161]:
        - strong [ref=f370e162]: The agent authenticates as itself, not as the application.
        - text: Entra Agent ID (built on the same federated workload identity model as Entra Workload ID) issues a short-lived, per-instance credential — no long-lived secret to leak, rotate, or forget about.
      - listitem [ref=f370e163]:
        - strong [ref=f370e164]: The mediation layer decides scope, not the agent's own code.
        - text: Azure API Management sits in front of every downstream call, validates the agent's token claims, and maps them to the narrowest possible permission — read this index, call this one model deployment, nothing else.
      - listitem [ref=f370e165]:
        - strong [ref=f370e166]: The mediation layer's own identity is a Managed Identity, not a secret.
        - text: The gateway itself never stores a client secret either. The chain of trust holds all the way down.
    - heading "Four Layers That Actually Survive Audit" [level=2] [ref=f370e167]
    - generic [ref=f370e169]:
      - generic [ref=f370e170]:
        - heading " 1. Per-Agent Workload Identity" [level=4] [ref=f370e171]:
          - generic [ref=f370e172]: 
          - text: 1. Per-Agent Workload Identity
        - paragraph [ref=f370e173]: Retire the shared app registration. Every agent — even every instance of the same agent — gets its own federated identity. There is no secret in a config file for an attacker to find, because there is no secret at all.
      - generic [ref=f370e174]:
        - heading " 2. Just-In-Time Scoped Access" [level=4] [ref=f370e175]:
          - generic [ref=f370e176]: 
          - text: 2. Just-In-Time Scoped Access
        - paragraph [ref=f370e177]: Standing RBAC roles get replaced with JIT permissions through Privileged Identity Management. An agent is eligible for a role, not permanently assigned it — the elevation exists only for the task's duration, granted through a pre-authorized policy rather than a human clicking "Activate" mid-task the way a person would.
      - generic [ref=f370e178]:
        - heading " 3. Mediation as the Enforcement Point" [level=4] [ref=f370e179]:
          - generic [ref=f370e180]: 
          - text: 3. Mediation as the Enforcement Point
        - paragraph [ref=f370e181]: No agent gets a direct connection string to a database or a raw API key to a model deployment. Every downstream call is forced through the API Mediation Layer, where policy — not agent code — decides what's allowed.
      - generic [ref=f370e182]:
        - heading " 4. Immutable, Per-Agent Audit Trail" [level=4] [ref=f370e183]:
          - generic [ref=f370e184]: 
          - text: 4. Immutable, Per-Agent Audit Trail
        - paragraph [ref=f370e185]: Every action is logged against the actual agent identity that took it, not the mediation layer's identity or a shared service account. That log is what turns "we think it was fine" into a defensible answer during an audit.
    - paragraph [ref=f370e186]: None of this is free. JIT elevation for a machine identity has to be pre-authorized — an agent can't sit in an approval queue waiting for a human to click "Activate" mid-task the way a person can. The real engineering cost of this pattern isn't the identity plumbing; it's designing the policy layer that decides, ahead of time, exactly which task types earn which scoped roles automatically. Underinvest there and you've just moved the standing-privilege problem from the agent's identity to an over-broad JIT policy. That policy design is the hard part of this migration — budget for it accordingly, and expect the first version of it to be wrong.
    - heading "The Zero Standing Privilege Rollout Sequence" [level=2] [ref=f370e187]
    - paragraph [ref=f370e189]: This isn't a rip-and-replace project. It's a sequence you can run against one agent at a time without stopping the pilot.
