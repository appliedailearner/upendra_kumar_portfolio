    - heading "What This Means for Your Next Audit" [level=2] [ref=f370e217]
    - paragraph [ref=f370e219]:
      - text: "Regulators evaluating AI systems — whether under an internal model-risk framework, HIPAA, or the EU AI Act's obligations for high-risk systems — keep asking a version of the same question:"
      - emphasis [ref=f370e220]: can you demonstrate control over what this system was allowed to do, and prove what it actually did?
      - text: A shared service principal cannot answer that question. It was never designed to.
    - paragraph [ref=f370e221]: Zero standing privilege isn't a compliance checkbox bolted on after the fact. It's the architecture that makes the answer to "prove it" a query against a log instead of a best-effort reconstruction. That's the difference between an agentic AI program that scales past the pilot and one that stays stuck in review indefinitely.
