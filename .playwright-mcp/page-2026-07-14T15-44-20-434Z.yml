    - paragraph [ref=f370e63]: "Almost every agentic AI pilot that reaches security review shares the same original sin: one shared service principal, standing access to a dozen downstream systems, and a static secret sitting in a key vault nobody rotates. The demo works. The audit doesn't."
    - generic [ref=f370e64]:
      - generic [ref=f370e65]: 
      - paragraph [ref=f370e67]:
        - text: Written by
        - strong [ref=f370e68]: Upendra Kumar
        - text: ", Microsoft Certified:"
        - strong [ref=f370e69]: Cybersecurity Architect Expert
        - text: and
        - strong [ref=f370e70]: Identity and Access Administrator Associate
        - text: — the identity architecture in this post is the same pattern used to evaluate agentic AI designs against those certification tracks.
    - generic [ref=f370e71]:
      - generic [ref=f370e73]:
        - generic [ref=f370e74]:
