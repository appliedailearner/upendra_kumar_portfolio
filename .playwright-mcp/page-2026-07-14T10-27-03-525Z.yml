    - paragraph [ref=f369e63]: "Every agentic AI pilot I've reviewed shares the same original sin: one shared service principal, standing access to a dozen downstream systems, and a static secret sitting in a key vault nobody rotates. The demo works. The audit doesn't."
    - generic [ref=f369e64]:
      - generic [ref=f369e66]:
        - generic [ref=f369e67]:
          - generic [ref=f369e68]: 
          - text: Strategic Alignment & ROI
        - heading "Executive Impact Summary" [level=2] [ref=f369e69]
      - generic [ref=f369e70]:
        - generic [ref=f369e71]:
          - generic [ref=f369e72]: 
          - generic [ref=f369e74]: 
          - heading "The Business Problem" [level=4] [ref=f369e76]
          - paragraph [ref=f369e77]: Agentic AI pilots stall in security review because every agent runs under a shared service principal with standing production access. When one agent misbehaves or gets compromised, the blast radius isn't one API call — it's every system that credential can reach. Auditors can't tell which agent did what, and the CISO won't sign off.
        - generic [ref=f369e78]:
          - generic [ref=f369e79]: 
          - generic [ref=f369e81]: 
          - heading "The Strategic Play" [level=4] [ref=f369e83]
          - paragraph [ref=f369e84]: Retire the shared service principal. Give every agent its own workload identity (Microsoft Entra Agent ID), route every call through an API Mediation Layer, and grant just-in-time, scoped permissions instead of standing RBAC roles. Every agent gets its own identity, its own audit trail, and access that expires the moment the task ends.
        - generic [ref=f369e85]:
          - generic [ref=f369e86]: 
          - generic [ref=f369e88]: 
          - heading "The Executive ROI" [level=4] [ref=f369e90]
          - paragraph [ref=f369e91]: Zero standing privilege collapses an agent's effective blast radius from every downstream system it could reach to the one scoped permission it actually used for that task. In practice, that's the difference between a multi-week security review that blocks a launch and a same-week sign-off — and the difference between a page-one incident and a single rotated token.
    - heading "The Standing Privilege Problem" [level=2] [ref=f369e92]
    - paragraph [ref=f369e94]:
      - text: Here's how almost every agentic AI pilot gets built. Someone needs the agent to read from Azure AI Search, call Azure OpenAI, write results to a database, and maybe kick off a downstream workflow. Under deadline pressure, the fastest path is one service principal, one client secret, and a role assignment broad enough that nobody has to come back and ask for more access later —
      - code [ref=f369e95]: Contributor
      - text: on the resource group, or worse, the subscription.
    - paragraph [ref=f369e96]: "It works. The demo ships. And then it goes to security review, where three questions kill the timeline every time:"
    - list [ref=f369e97]:
      - listitem [ref=f369e98]:
        - strong [ref=f369e99]: "\"Which agent did this?\""
        - text: Every action in the logs shows the same generic identity —
        - code [ref=f369e100]: svc-ai-agent-prod
        - text: — whether it was Agent A summarizing a contract or Agent B deleting a stale record. There is no per-agent audit trail.
      - listitem [ref=f369e101]:
        - strong [ref=f369e102]: "\"What's the blast radius if this credential leaks?\""
        - text: "The honest answer is: everything that service principal can touch. Not the one API the agent actually needed — every system the team was ever lazy enough to grant it."
      - listitem [ref=f369e103]:
        - strong [ref=f369e104]: "\"How do you revoke just this agent?\""
        - text: You can't, without breaking every other agent sharing the same identity. The only lever is "rotate the secret and redeploy everything," which nobody wants to do mid-incident.
    - paragraph [ref=f369e105]: None of this is a model problem. GPT-4, Claude, or whatever LLM is doing the reasoning is not the risk. The risk is the plumbing underneath it — the fact that most agentic AI architectures were built by borrowing the identity pattern from a 2015-era backend service, not designed for a fleet of autonomous actors that can each take independent action.
    - generic [ref=f369e106]:
      - 'heading "Architect''s Corner: A Badge vs. a Master Key" [level=3] [ref=f369e107]'
      - generic [ref=f369e108]:
        - generic [ref=f369e109]:
          - 'heading " The Legacy: One Master Key" [level=5] [ref=f369e110]':
            - generic [ref=f369e111]: 
            - text: "The Legacy: One Master Key"
          - paragraph [ref=f369e112]: A shared service principal is a master key handed to every contractor on a building site. It opens every door, all day, every day — because cutting a new key for each contractor felt like too much overhead.
          - list [ref=f369e113]:
            - listitem [ref=f369e114]:
              - generic [ref=f369e115]: 
              - text: Lose the key, and every door on the site is compromised — not just the one the contractor was supposed to be in.
            - listitem [ref=f369e116]:
              - generic [ref=f369e117]: 
              - text: The security log just says "master key used." It never says which contractor, or which door.
        - generic [ref=f369e118]:
          - 'heading " Zero Standing Privilege: A Badge" [level=5] [ref=f369e119]':
            - generic [ref=f369e120]: 
            - text: "Zero Standing Privilege: A Badge"
          - paragraph [ref=f369e121]: A per-agent workload identity is a badge that only opens the specific doors that agent needs, only while it's clocked in for that specific task, and logs the exact person and door every single time.
          - list [ref=f369e122]:
            - listitem [ref=f369e123]:
              - generic [ref=f369e124]: 
              - text: Lose one badge, and exactly one contractor's access is revoked. Everyone else keeps working.
            - listitem [ref=f369e125]:
              - generic [ref=f369e126]: 
              - text: The security log names the person, the door, and the minute. That's what a regulator actually wants to see.
    - 'heading "The Architecture: Per-Agent Identity, Not Per-Application" [level=2] [ref=f369e127]'
    - paragraph [ref=f369e129]: The fix isn't a new product — it's a different default. Instead of one identity per application (or worse, per environment), every agent instance gets its own workload identity, and every call it makes is forced through a mediation layer that enforces scope before anything reaches a backend system.
    - generic [ref=f369e130]:
      - heading "Per-Agent Identity Through the API Mediation Layer" [level=4] [ref=f369e131]
      - 'img "Architecture diagram: AI agent identity flowing through an API Mediation Layer with managed identity, scoped routing to Azure AI Search and Azure OpenAI, and auditable logs"'
      - paragraph [ref=f369e132]:
        - generic [ref=f369e133]: 
        - text: Every agent request carries its own identity through the mediation layer. The gateway — not the agent — holds the managed identity that talks to backend services, so no agent ever sees a raw connection string or API key. Every hop is logged against the agent that made it.
    - paragraph [ref=f369e134]: "Three things make this different from a normal API gateway pattern:"
    - list [ref=f369e135]:
      - listitem [ref=f369e136]:
        - strong [ref=f369e137]: The agent authenticates as itself, not as the application.
        - text: Entra Agent ID (built on the same federated workload identity model as Entra Workload ID) issues a short-lived, per-instance credential — no long-lived secret to leak, rotate, or forget about.
      - listitem [ref=f369e138]:
        - strong [ref=f369e139]: The mediation layer decides scope, not the agent's own code.
        - text: Azure API Management sits in front of every downstream call, validates the agent's token claims, and maps them to the narrowest possible permission — read this index, call this one model deployment, nothing else.
      - listitem [ref=f369e140]:
        - strong [ref=f369e141]: The mediation layer's own identity is a Managed Identity, not a secret.
        - text: The gateway itself never stores a client secret either. The chain of trust holds all the way down.
    - heading "Four Layers That Actually Survive Audit" [level=2] [ref=f369e142]
    - generic [ref=f369e144]:
      - generic [ref=f369e145]:
        - heading " 1. Per-Agent Workload Identity" [level=4] [ref=f369e146]:
          - generic [ref=f369e147]: 
          - text: 1. Per-Agent Workload Identity
        - paragraph [ref=f369e148]: Retire the shared app registration. Every agent — even every instance of the same agent — gets its own federated identity. There is no secret in a config file for an attacker to find, because there is no secret at all.
      - generic [ref=f369e149]:
        - heading " 2. Just-In-Time Scoped Access" [level=4] [ref=f369e150]:
          - generic [ref=f369e151]: 
          - text: 2. Just-In-Time Scoped Access
        - paragraph [ref=f369e152]: Standing RBAC roles get replaced with JIT permissions through Privileged Identity Management. An agent is eligible for a role, not permanently assigned it — the elevation exists only for the task's duration.
      - generic [ref=f369e153]:
        - heading " 3. Mediation as the Enforcement Point" [level=4] [ref=f369e154]:
          - generic [ref=f369e155]: 
          - text: 3. Mediation as the Enforcement Point
        - paragraph [ref=f369e156]: No agent gets a direct connection string to a database or a raw API key to a model deployment. Every downstream call is forced through the API Mediation Layer, where policy — not agent code — decides what's allowed.
      - generic [ref=f369e157]:
        - heading " 4. Immutable, Per-Agent Audit Trail" [level=4] [ref=f369e158]:
          - generic [ref=f369e159]: 
          - text: 4. Immutable, Per-Agent Audit Trail
        - paragraph [ref=f369e160]: Every action is logged against the actual agent identity that took it, not the mediation layer's identity or a shared service account. That log is what turns "we think it was fine" into a defensible answer during an audit.
