<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #444; }
      .h2 { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .text { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #333; }
      .note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #BFC7D5; stroke-width: 2; rx: 18; ry: 18; }
      .box2 { fill: #F7F9FC; stroke: #BFC7D5; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #EAF3FF; stroke: #2B78E4; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #6B7280; stroke-width: 2.5; fill: none; }
      .arrow { marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6B7280" />
    </marker>
  </defs>
<text x="60" y="70" class="title" text-anchor="start">APIM Products</text>
<text x="60" y="105" class="subtitle" text-anchor="start">Corridors vs Gates. Why UKLifeLabs uses Products (not just paths).</text>
<rect x="80" y="180" width="820" height="820" class="box2"/>
<text x="120" y="230" class="h2" text-anchor="start">Option A: Paths as corridors</text>
<text x="120" y="265" class="note" text-anchor="start">Fast to build. Easy to sprawl.</text>
<rect x="140" y="320" width="700" height="220" class="box"/>
<text x="490" y="360" class="text" text-anchor="middle">/api/*  (single corridor)</text>
<text x="490" y="400" class="note" text-anchor="middle">One set of policies for everyone.
Hard to prove least privilege.
Rate limits become political.</text>
<rect x="170" y="580" width="130" height="120" class="box"/>
<text x="235" y="650" class="small" text-anchor="middle">Team A</text>
<text x="235" y="675" class="note" text-anchor="middle">Same key</text>
<line x1="490" y1="540" x2="235" y2="580" class="line arrow"/>
<rect x="340" y="580" width="130" height="120" class="box"/>
<text x="405" y="650" class="small" text-anchor="middle">Team B</text>
<text x="405" y="675" class="note" text-anchor="middle">Same key</text>
<line x1="490" y1="540" x2="405" y2="580" class="line arrow"/>
<rect x="510" y="580" width="130" height="120" class="box"/>
<text x="575" y="650" class="small" text-anchor="middle">Vendor C</text>
<text x="575" y="675" class="note" text-anchor="middle">Same key</text>
<line x1="490" y1="540" x2="575" y2="580" class="line arrow"/>
<rect x="680" y="580" width="130" height="120" class="box"/>
<text x="745" y="650" class="small" text-anchor="middle">Internal Apps</text>
<text x="745" y="675" class="note" text-anchor="middle">Same key</text>
<line x1="490" y1="540" x2="745" y2="580" class="line arrow"/>
<rect x="1020" y="180" width="820" height="820" class="box2"/>
<text x="1060" y="230" class="h2" text-anchor="start">Option B: Products as gates</text>
<text x="1060" y="265" class="note" text-anchor="start">Governed access. Clean audit trails.</text>
<rect x="1080" y="320" width="330" height="220" class="accent"/>
<text x="1245" y="365" class="small" text-anchor="middle">Product: Employee Copilot</text>
<text x="1245" y="415" class="note" text-anchor="middle">MFA + device
Higher TPM
Internal-only APIs</text>
<rect x="1450" y="320" width="330" height="220" class="accent"/>
<text x="1615" y="365" class="small" text-anchor="middle">Product: Partner APIs</text>
<text x="1615" y="415" class="note" text-anchor="middle">mTLS + IP allowlist
Quota + per-client keys
External contracts</text>
<rect x="1080" y="580" width="330" height="220" class="accent"/>
<text x="1245" y="625" class="small" text-anchor="middle">Product: Batch Ingestion</text>
<text x="1245" y="675" class="note" text-anchor="middle">Async patterns
Burst control
Change windows</text>
<rect x="1450" y="580" width="330" height="220" class="accent"/>
<text x="1615" y="625" class="small" text-anchor="middle">Product: Sandbox</text>
<text x="1615" y="675" class="note" text-anchor="middle">Lower risk
Tight quotas
Non-prod models</text>
<text x="1060" y="890" class="note" text-anchor="start">Result: each gate has its own subscription keys, policies, quotas, and evidence.</text>
<text x="120" y="890" class="note" text-anchor="start">Result: every corridor shares the same risk profile, even when consumers differ.</text>
</svg>
