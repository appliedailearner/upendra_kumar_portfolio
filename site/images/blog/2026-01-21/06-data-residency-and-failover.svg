<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      /* Typography */
      .font-header { font: 800 48px 'Outfit', 'Segoe UI', sans-serif; fill: #F8FAFC; letter-spacing: -0.02em; }
      .font-sub { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      
      .font-h2 { font: 700 32px 'Outfit', 'Segoe UI', sans-serif; }
      .font-note { font: 400 18px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      .font-label { font: 600 20px 'Outfit', 'Segoe UI', sans-serif; fill: #E2E8F0; }
      
      /* Panels */
      .panel-avoid { 
        fill: rgba(15, 23, 42, 0.4); 
        stroke: rgba(239, 68, 68, 0.3); /* Red border */
        stroke-width: 2; 
        rx: 16; ry: 16;
      }
      .panel-approach { 
        fill: rgba(15, 23, 42, 0.6); 
        stroke: rgba(56, 189, 248, 0.5); /* Blue border */
        stroke-width: 2; 
        rx: 16; ry: 16;
      }
      
      /* Inner Elements */
      .vault {
        fill: rgba(56, 189, 248, 0.1);
        stroke: #38BDF8;
        stroke-width: 2;
        rx: 12; ry: 12;
      }
      .cloud-fog {
        fill: rgba(239, 68, 68, 0.05);
        stroke: #EF4444;
        stroke-width: 2;
        stroke-dasharray: 8 4;
        rx: 12; ry: 12;
      }
      
      .arrow { stroke: #64748B; stroke-width: 2; marker-end: url(#arrowhead); }

    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B" />
    </marker>

    <radialGradient id="glow-bg" cx="50%" cy="0%" r="80%">
        <stop offset="0%" style="stop-color:rgba(56, 189, 248, 0.1)"/>
        <stop offset="100%" style="stop-color:rgba(15, 23, 42, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F172A" />
  <circle cx="960" cy="0" r="1200" fill="url(#glow-bg)" />

  <!-- Header -->
  <text x="100" y="100" class="font-header">Sovereignty Strategy: Regional vs. Global</text>
  <text x="100" y="140" class="font-sub">Why we rely on DNS Failover (Traffic Manager) instead of Global L7 Proxies</text>

  <!-- ===============================
       LEFT: What We Avoid (Global Proxy)
       =============================== -->
  <g transform="translate(100, 200)">
      <rect width="840" height="780" class="panel-avoid" />
      
      <text x="50" y="80" class="font-h2" fill="#EF4444">What We Avoid: Global L7 Proxy</text>
      <text x="50" y="120" class="font-note">"The Compliance Fog"</text>
      
      <!-- Visual: Big Leaky Cloud -->
      <g transform="translate(120, 250)">
          <rect x="0" y="0" width="600" height="150" class="cloud-fog" />
          <text x="300" y="60" text-anchor="middle" class="font-label" fill="#EF4444">Global Edge (Terminates TLS)</text>
          <text x="300" y="90" text-anchor="middle" class="font-note" font-size="14">Risk: Logs &amp; Processing outside UK.</text>
          <text x="300" y="110" text-anchor="middle" class="font-note" font-size="14">Hard to prove "Data never left".</text>
          
          <!-- Arrows down -->
          <line x1="200" y1="150" x2="150" y2="300" class="arrow" />
          <line x1="400" y1="150" x2="450" y2="300" class="arrow" />
      </g>
      
      <!-- Origins (Obscured) -->
      <g transform="translate(70, 550)">
           <rect width="250" height="120" fill="rgba(255,255,255,0.05)" rx="8" />
           <text x="125" y="65" text-anchor="middle" class="font-label" fill="#64748B">Origin A</text>
      </g>
      <g transform="translate(520, 550)">
           <rect width="250" height="120" fill="rgba(255,255,255,0.05)" rx="8" />
           <text x="125" y="65" text-anchor="middle" class="font-label" fill="#64748B">Origin B</text>
      </g>
      
      <text x="420" y="720" text-anchor="middle" class="font-note" fill="#EF4444">Result: Ambiguous residency. Regulatory friction.</text>
  </g>

  <!-- ===============================
       RIGHT: Our Approach (Regional)
       =============================== -->
  <g transform="translate(980, 200)">
      <rect width="840" height="780" class="panel-approach" />
      
      <text x="50" y="80" class="font-h2" fill="#38BDF8">Our Approach: Regional Vaults</text>
      <text x="50" y="120" class="font-note">"The Sovereign Guarantee"</text>
      
      <!-- Visual: Cloudflare + TM -->
      <g transform="translate(70, 200)">
          <rect width="700" height="80" class="vault" style="fill:rgba(56, 189, 248, 0.05); stroke-dasharray: 4 4;" />
          <text x="350" y="45" text-anchor="middle" class="font-label" fill="#38BDF8">Traffic Manager (DNS) + Cloudflare</text>
          <text x="350" y="70" text-anchor="middle" class="font-note" font-size="14">Route decisions only. No data decryption.</text>
      </g>
      
      <!-- Arrows splitting -->
       <line x1="300" y1="280" x2="200" y2="350" class="arrow" stroke="#38BDF8"/>
       <line x1="540" y1="280" x2="640" y2="350" class="arrow" stroke="#38BDF8"/>

      <!-- Region 1: UK West -->
      <g transform="translate(70, 350)">
          <rect width="320" height="300" class="vault" />
          
          <!-- Flag/Icon -->
          <circle cx="40" cy="40" r="20" fill="#0F172A" stroke="#38BDF8" />
          <text x="40" y="45" text-anchor="middle" font-size="20">🇬🇧</text>
          
          <text x="80" y="45" class="font-label" fill="#38BDF8">UK West (Active)</text>
          
          <!-- Stack -->
          <g transform="translate(20, 80)">
             <text x="0" y="20" class="font-note" font-size="15" fill="#E2E8F0">1. App Gateway (WAF)</text>
             <text x="0" y="50" class="font-note" font-size="15" fill="#E2E8F0">2. APIM (Governance)</text>
             <text x="0" y="80" class="font-note" font-size="15" fill="#E2E8F0">3. OpenAI (PTU)</text>
             <text x="0" y="110" class="font-note" font-size="15" fill="#E2E8F0">4. AI Search (Index)</text>
             
             <text x="0" y="180" class="font-note" font-size="14" fill="#38BDF8">Status: Processing</text>
          </g>
      </g>

      <!-- Region 2: UK South -->
      <g transform="translate(450, 350)">
          <rect width="320" height="300" class="vault" style="opacity: 0.7;"/>
          
          <!-- Flag/Icon -->
          <circle cx="40" cy="40" r="20" fill="#0F172A" stroke="#94A3B8" />
          <text x="40" y="45" text-anchor="middle" font-size="20">🇬🇧</text>
          
          <text x="80" y="45" class="font-label" fill="#94A3B8">UK South (Passive)</text>
          
           <!-- Stack -->
          <g transform="translate(20, 80)">
             <text x="0" y="20" class="font-note" font-size="15">1. App Gateway (WAF)</text>
             <text x="0" y="50" class="font-note" font-size="15">2. APIM (Governance)</text>
             <text x="0" y="80" class="font-note" font-size="15">3. OpenAI (PTU)</text>
             <text x="0" y="110" class="font-note" font-size="15">4. AI Search (Replica)</text>
             
             <text x="0" y="180" class="font-note" font-size="14" fill="#94A3B8">Status: Warm Standby</text>
          </g>
      </g>
      
      <text x="420" y="720" text-anchor="middle" class="font-note" fill="#38BDF8">Result: 100% Sovereign. Zero ambiguity.</text>
  </g>

</svg>
