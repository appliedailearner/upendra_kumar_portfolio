<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #444; }
      .h2 { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .text { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #333; }
      .note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #BFC7D5; stroke-width: 2; rx: 18; ry: 18; }
      .box2 { fill: #F7F9FC; stroke: #BFC7D5; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #EAF3FF; stroke: #2B78E4; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #6B7280; stroke-width: 2.5; fill: none; }
      .arrow { marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6B7280" />
    </marker>
  </defs>
<text x="60" y="70" class="title" text-anchor="start">Data Residency and Failover</text>
<text x="60" y="105" class="subtitle" text-anchor="start">Why we stay regional (UK West + UK South) and fail over with DNS, not a global L7 proxy</text>
<rect x="80" y="180" width="850" height="820" class="box2"/>
<text x="120" y="230" class="h2" text-anchor="start">What we avoid: Global L7 proxy for model traffic</text>
<text x="120" y="265" class="note" text-anchor="start">Risk: data processing and logs can traverse non-UK regions.</text>
<rect x="160" y="340" width="690" height="140" class="box"/>
<text x="505" y="385" class="text" text-anchor="middle">Global edge terminates and routes</text>
<text x="505" y="420" class="note" text-anchor="middle">Harder to prove residency.
More moving parts in incident response.</text>
<rect x="160" y="540" width="320" height="160" class="accent"/>
<text x="320" y="590" class="small" text-anchor="middle">UK West</text>
<text x="320" y="625" class="note" text-anchor="middle">Origin</text>
<rect x="530" y="540" width="320" height="160" class="accent"/>
<text x="690" y="590" class="small" text-anchor="middle">UK South</text>
<text x="690" y="625" class="note" text-anchor="middle">Origin</text>
<line x1="505" y1="480" x2="320" y2="540" class="line arrow"/>
<line x1="505" y1="480" x2="690" y2="540" class="line arrow"/>
<text x="120" y="750" class="note" text-anchor="start">If residency is contractual, avoid ambiguity.</text>
<rect x="990" y="180" width="850" height="820" class="box2"/>
<text x="1030" y="230" class="h2" text-anchor="start">Our approach: Cloudflare + Traffic Manager, regional origins</text>
<text x="1030" y="265" class="note" text-anchor="start">All compute and data stays inside UK West / UK South.</text>
<rect x="1050" y="330" width="710" height="90" class="accent"/>
<text x="1405" y="385" class="small" text-anchor="middle">Traffic Manager (DNS) + Cloudflare Edge</text>
<text x="1405" y="410" class="note" text-anchor="middle">DNS decides, edge protects. Origins stay regional.</text>
<rect x="1050" y="470" width="330" height="220" class="accent"/>
<text x="1215" y="510" class="small" text-anchor="middle">UK West (Active)</text>
<text x="1215" y="545" class="note" text-anchor="middle">APIM + AppGW + AI
Regional model + data</text>
<rect x="1430" y="470" width="330" height="220" class="accent"/>
<text x="1595" y="510" class="small" text-anchor="middle">UK South (Warm standby)</text>
<text x="1595" y="545" class="note" text-anchor="middle">Same stack
DR drills</text>
<line x1="1405" y1="420" x2="1215" y2="470" class="line arrow"/>
<line x1="1405" y1="420" x2="1595" y2="470" class="line arrow"/>
<rect x="1050" y="740" width="710" height="220" class="box"/>
<text x="1065" y="780" class="h2" text-anchor="start">Why Cloudflare (not Front Door) in this client context</text>
<text x="1065" y="820" class="note" text-anchor="start">1) Existing enterprise edge standard (contracts, SOC runbooks)
2) Mature bot/DDoS posture already tuned for the estate
3) Keeps Azure-side architecture simpler and more auditable
4) Front Door Premium can be great, but it adds a second edge layer to govern</text>
</svg>
