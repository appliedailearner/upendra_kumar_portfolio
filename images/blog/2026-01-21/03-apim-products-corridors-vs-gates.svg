<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      /* Typography */
      .font-header { font: 800 48px 'Outfit', 'Segoe UI', sans-serif; fill: #F8FAFC; letter-spacing: -0.02em; }
      .font-sub { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      
      .font-h2 { font: 700 32px 'Outfit', 'Segoe UI', sans-serif; }
      .font-note { font: 400 18px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      .font-label { font: 600 20px 'Outfit', 'Segoe UI', sans-serif; fill: #E2E8F0; }
      
      /* Panels */
      .panel-a { 
        fill: rgba(15, 23, 42, 0.4); 
        stroke: rgba(239, 68, 68, 0.3); /* Red border for "Bad" option */
        stroke-width: 2; 
        rx: 16; ry: 16;
      }
      .panel-b { 
        fill: rgba(15, 23, 42, 0.6); 
        stroke: rgba(56, 189, 248, 0.5); /* Blue border for "Good" option */
        stroke-width: 2; 
        rx: 16; ry: 16;
      }
      
      /* Inner Elements */
      .pipe { fill: none; stroke: #475569; stroke-width: 8; stroke-linecap: round; }
      .pipe-active { stroke: #EF4444; stroke-dasharray: 10 10; animation: flow 3s linear infinite; }
      
      .product-card {
        fill: rgba(56, 189, 248, 0.1);
        stroke: #38BDF8;
        stroke-width: 2;
        rx: 8; ry: 8;
      }
      
      /* Animations */
      @keyframes flow {
        to { stroke-dashoffset: -40; }
      }
    </style>
    
    <radialGradient id="glow-bg" cx="50%" cy="0%" r="80%">
        <stop offset="0%" style="stop-color:rgba(56, 189, 248, 0.1)"/>
        <stop offset="100%" style="stop-color:rgba(15, 23, 42, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F172A" />
  <circle cx="960" cy="0" r="1200" fill="url(#glow-bg)" />

  <!-- Header -->
  <text x="100" y="100" class="font-header">The Governance Choice: Corridors vs. Gates</text>
  <text x="100" y="140" class="font-sub">Why paths are not enough for secure AI access</text>

  <!-- ===============================
       OPTION A: The "Wild West" (Left)
       =============================== -->
  <g transform="translate(100, 200)">
      <rect width="840" height="780" class="panel-a" />
      
      <!-- Icon: Warning/Unlocked -->
      <text x="50" y="80" class="font-h2" fill="#EF4444">Option A: Paths as Corridors</text>
      <text x="50" y="120" class="font-note">"The Open Hallway"</text>
      <text x="50" y="150" class="font-note" transform="translate(0,20)">
        • Single Policy applied to everyone
        • No consumer-level visibility
        • Sprawl = Risk
      </text>

      <!-- Visual: Leaky Pipe -->
      <g transform="translate(100, 300)">
          <!-- Main Pipe -->
          <rect x="50" y="0" width="540" height="80" rx="40" fill="#1E293B" stroke="#475569" stroke-width="2"/>
          <text x="320" y="50" text-anchor="middle" class="font-label" fill="#EF4444" style="font-family: monospace;">/api/*</text>
          
          <!-- Leaks -->
          <line x1="120" y1="80" x2="120" y2="250" class="pipe" />
          <line x1="250" y1="80" x2="250" y2="250" class="pipe" />
          <line x1="380" y1="80" x2="380" y2="250" class="pipe" />
          <line x1="510" y1="80" x2="510" y2="250" class="pipe" />

          <!-- Consumers (Generic) -->
          <g transform="translate(70, 260)">
             <rect width="100" height="60" rx="4" fill="#334155" />
             <text x="50" y="40" text-anchor="middle" fill="#94A3B8" font-size="14">Team A</text>
          </g>
           <g transform="translate(200, 260)">
             <rect width="100" height="60" rx="4" fill="#334155" />
             <text x="50" y="40" text-anchor="middle" fill="#94A3B8" font-size="14">Team B</text>
          </g>
           <g transform="translate(330, 260)">
             <rect width="100" height="60" rx="4" fill="#334155" />
             <text x="50" y="40" text-anchor="middle" fill="#94A3B8" font-size="14">Vendor</text>
          </g>
           <g transform="translate(460, 260)">
             <rect width="100" height="60" rx="4" fill="#334155" />
             <text x="50" y="40" text-anchor="middle" fill="#94A3B8" font-size="14">Unknown</text>
          </g>
          
          <text x="320" y="380" text-anchor="middle" class="font-note" fill="#EF4444">Result: Everyone shares the same key &amp; limits.</text>
      </g>
  </g>

  <!-- ===============================
       OPTION B: The "Secure Vault" (Right)
       =============================== -->
  <g transform="translate(980, 200)">
      <rect width="840" height="780" class="panel-b" />
      
      <!-- Icon: Shield/Key -->
      <text x="50" y="80" class="font-h2" fill="#38BDF8">Option B: Products as Gates</text>
      <text x="50" y="120" class="font-note">"The Secure Vaults"</text>
       <text x="50" y="150" class="font-note" transform="translate(0,20)">
        • Policies per-product
        • Specific Keys &amp; Quotas per-user
        • Clean Audit Trail
      </text>

      <!-- Visual: Product Cards -->
      <g transform="translate(60, 250)">
      
         <!-- Product 1: Copilot -->
         <g transform="translate(0, 0)">
            <rect width="320" height="180" class="product-card" />
            <text x="30" y="40" class="font-label" fill="#38BDF8">Product: Copilot</text>
            <text x="30" y="80" class="font-note" font-size="14">✓ MFA + Device Check</text>
            <text x="30" y="110" class="font-note" font-size="14">✓ 500 TPM Limit</text>
            <text x="30" y="140" class="font-note" font-size="14">✓ Internal Trait</text>
         </g>

         <!-- Product 2: Partner -->
         <g transform="translate(360, 0)">
            <rect width="320" height="180" class="product-card" style="stroke: #A855F7; fill: rgba(168, 85, 247, 0.1);"/>
            <text x="30" y="40" class="font-label" fill="#A855F7">Product: External</text>
            <text x="30" y="80" class="font-note" font-size="14">✓ mTLS Required</text>
            <text x="30" y="110" class="font-note" font-size="14">✓ 50 TPM Limit</text>
            <text x="30" y="140" class="font-note" font-size="14">✓ IP Whitelist</text>
         </g>

         <!-- Product 3: Sandbox -->
         <g transform="translate(180, 220)">
            <rect width="320" height="180" class="product-card" style="stroke: #22C55E; fill: rgba(34, 197, 94, 0.1);"/>
            <text x="30" y="40" class="font-label" fill="#22C55E">Product: Sandbox</text>
            <text x="30" y="80" class="font-note" font-size="14">✓ No PII Allowed</text>
            <text x="30" y="110" class="font-note" font-size="14">✓ Low Cost Model</text>
            <text x="30" y="140" class="font-note" font-size="14">✓ Auto-Expiry</text>
         </g>
         
         <text x="340" y="480" text-anchor="middle" class="font-note" fill="#38BDF8">Result: Precision control per use-case.</text>

      </g>
  </g>

</svg>
