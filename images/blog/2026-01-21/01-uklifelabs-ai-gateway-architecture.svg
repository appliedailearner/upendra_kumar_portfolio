<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Styles -->
    <style>
      /* Typography */
      .font-header { font: 800 48px 'Outfit', 'Segoe UI', sans-serif; fill: #F8FAFC; letter-spacing: -0.02em; }
      .font-sub { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      .font-label { font: 600 20px 'Inter', 'Segoe UI', sans-serif; fill: #F1F5F9; text-anchor: middle; }
      .font-desc { font: 400 14px 'Inter', 'Segoe UI', sans-serif; fill: #CBD5E1; text-anchor: middle; opacity: 0.8; }
      .font-region { font: 700 28px 'Outfit', 'Segoe UI', sans-serif; fill: #38BDF8; text-transform: uppercase; letter-spacing: 0.05em; }
      
      /* Containers */
      .glass-panel { 
        fill: rgba(15, 23, 42, 0.4); 
        stroke: rgba(56, 189, 248, 0.3); 
        stroke-width: 2; 
        rx: 16; ry: 16;
        backdrop-filter: blur(10px);
      }
      .glass-panel-inactive {
        fill: rgba(15, 23, 42, 0.2);
        stroke: rgba(148, 163, 184, 0.2);
        stroke-width: 1;
        stroke-dasharray: 8 8;
        rx: 16; ry: 16;
      }
      
      /* Services Buttons */
      .service-box {
        fill: #1E293B;
        stroke: #38BDF8;
        stroke-width: 2;
        rx: 8; ry: 8;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      }
      .service-box-security { stroke: #F43F5E; } /* Red for Security */
      .service-box-data { stroke: #22C55E; } /* Green for Data */
      
      /* Data Flows */
      .flow {
        fill: none;
        stroke: #38BDF8;
        stroke-width: 3;
        stroke-dasharray: 12 12;
        opacity: 0.8;
        animation: flowAnim 3s linear infinite;
      }
      .flow-data { stroke: #22C55E; animation-duration: 6s; }
      
      @keyframes flowAnim {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      
      /* Icons Paths (Simplified) */
      .icon { fill: #fff; opacity: 0.9; }
    </style>
    
    <!-- Arrows -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#22C55E" />
    </marker>
    
    <!-- Glow -->
    <radialGradient id="glow-bg" cx="50%" cy="40%" r="60%">
        <stop offset="0%" style="stop-color:rgba(56, 189, 248, 0.1)"/>
        <stop offset="100%" style="stop-color:rgba(15, 23, 42, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background Ambience -->
  <rect width="1920" height="1080" fill="transparent" />
  <circle cx="960" cy="540" r="900" fill="url(#glow-bg)" />

  <!-- Header -->
  <text x="60" y="80" class="font-header">UKLifeLabs AI Gateway Pattern</text>
  <text x="60" y="120" class="font-sub">High-Available, Regionally Governed Architecture • <tspan fill="#38BDF8" font-weight="700">Azure Design Blueprint</tspan></text>

  <!-- Legend -->
  <g transform="translate(1450, 50)">
      <rect width="400" height="80" fill="rgba(15,23,42,0.8)" rx="10" stroke="#334155" />
      <line x1="30" y1="25" x2="80" y2="25" class="flow" stroke-dasharray="0" stroke-width="4" /> 
      <text x="95" y="30" class="font-desc" style="text-anchor:start; fill:#fff;">User Request (Real-time)</text>
      
      <line x1="30" y1="55" x2="80" y2="55" class="flow flow-data" stroke-dasharray="0" stroke-width="4" />
      <text x="95" y="60" class="font-desc" style="text-anchor:start; fill:#fff;">Data Ingestion (Batch)</text>
  </g>

  <!-- LAYER 1: GLOBAL ROUTING -->
  <g transform="translate(60, 180)">
    <rect width="1800" height="140" class="glass-panel" />
    <text x="40" y="50" class="font-region" style="font-size:20px; fill:#94A3B8;">Global Ingress Layer</text>
    
    <!-- Internet -->
    <g transform="translate(1400, 30)">
       <circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)" stroke="#fff" stroke-width="1" stroke-dasharray="4 4" />
       <text x="50" y="55" class="font-label">Internet</text>
    </g>
    
    <!-- Cloudflare -->
    <g transform="translate(900, 30)">
       <rect width="200" height="80" class="service-box service-box-security" />
       <text x="100" y="45" class="font-label">Cloudflare</text>
       <text x="100" y="65" class="font-desc">Enterprise Edge + WAF</text>
    </g>
    
    <!-- Traffic Manager -->
    <g transform="translate(400, 30)">
       <rect width="220" height="80" class="service-box" />
       <text x="110" y="45" class="font-label">Traffic Manager</text>
       <text x="110" y="65" class="font-desc">DNS Priority Routing</text>
    </g>
    
    <!-- Connections -->
    <line x1="1350" y1="70" x2="1110" y2="70" class="flow" marker-end="url(#arrow-blue)" />
    <line x1="890" y1="70" x2="630" y2="70" class="flow" marker-end="url(#arrow-blue)" />
    
    <!-- Downward Flow -->
    <path d="M510,110 L510,160" class="flow" marker-end="url(#arrow-blue)" />
  </g>

  <!-- LAYER 2: UK WEST (ACTIVE) -->
  <g transform="translate(60, 360)">
    <rect width="1150" height="680" class="glass-panel" stroke="#38BDF8" stroke-width="3" />
    <text x="40" y="50" class="font-region">Region A: UK West (Active)</text>
    <text x="400" y="50" class="font-desc" style="text-anchor:start;">Primary workload processing</text>

    <!-- DMZ -->
    <g transform="translate(50, 90)">
        <!-- Palo Alto -->
        <g transform="translate(0, 0)">
            <rect width="220" height="90" class="service-box service-box-security" />
            <text x="110" y="40" class="font-label">Palo Alto</text>
            <text x="110" y="70" class="font-desc">N-S Inspection</text>
        </g>
        
        <!-- App Gateway -->
        <g transform="translate(300, 0)">
            <rect width="220" height="90" class="service-box service-box-security" />
            <text x="110" y="40" class="font-label">App Gateway</text>
            <text x="110" y="70" class="font-desc">L7 WAF</text>
        </g>
        
        <!-- APIM -->
        <g transform="translate(600, 0)">
            <rect width="220" height="90" class="service-box" />
            <text x="110" y="40" class="font-label">APIM</text>
            <text x="110" y="70" class="font-desc">AI Gateway Policy</text>
        </g>

        <!-- DMZ Arrows -->
        <line x1="225" y1="45" x2="295" y2="45" class="flow" marker-end="url(#arrow-blue)" />
        <line x1="525" y1="45" x2="595" y2="45" class="flow" marker-end="url(#arrow-blue)" />
        
        <!-- Split to Lanes -->
        <path d="M710,90 L710,140 L300,140 L300,220" class="flow" marker-end="url(#arrow-blue)" />
        <path d="M710,90 L710,140 L800,140 L800,220" class="flow flow-data" marker-end="url(#arrow-green)" />
    </g>

    <!-- Lane A: Chat -->
    <g transform="translate(50, 250)">
        <rect width="500" height="380" fill="rgba(6, 182, 212, 0.05)" rx="12" stroke="rgba(6, 182, 212, 0.2)" />
        <text x="250" y="35" class="font-label" style="fill:#22D3EE;">Lane A: Real-time Chat</text>
        
        <g transform="translate(140, 60)">
            <rect width="220" height="70" class="service-box" />
            <text x="110" y="40" class="font-label">AI Search</text>
        </g>
        
        <g transform="translate(140, 160)">
            <rect width="220" height="70" class="service-box" />
            <text x="110" y="40" class="font-label">Azure OpenAI</text>
        </g>
        
        <g transform="translate(140, 260)">
            <rect width="220" height="70" class="service-box" />
            <text x="110" y="40" class="font-label">Response Builder</text>
        </g>
        
        <line x1="250" y1="130" x2="250" y2="155" class="flow" marker-end="url(#arrow-blue)" />
        <line x1="250" y1="230" x2="250" y2="255" class="flow" marker-end="url(#arrow-blue)" />
    </g>

    <!-- Lane B: Ingestion -->
    <g transform="translate(580, 250)">
        <rect width="500" height="380" fill="rgba(34, 197, 94, 0.05)" rx="12" stroke="rgba(34, 197, 94, 0.2)" />
        <text x="250" y="35" class="font-label" style="fill:#4ADE80;">Lane B: Data Ingestion</text>

        <g transform="translate(140, 60)">
            <rect width="220" height="70" class="service-box service-box-data" />
            <text x="110" y="40" class="font-label">ADLS Gen2</text>
        </g>
        
        <g transform="translate(140, 160)">
            <rect width="220" height="70" class="service-box service-box-data" />
            <text x="110" y="40" class="font-label">Doc Intelligence</text>
        </g>
        
        <g transform="translate(140, 260)">
            <rect width="220" height="70" class="service-box service-box-data" />
            <text x="110" y="40" class="font-label">Indexer</text>
        </g>

        <line x1="250" y1="130" x2="250" y2="155" class="flow flow-data" marker-end="url(#arrow-green)" />
        <line x1="250" y1="230" x2="250" y2="255" class="flow flow-data" marker-end="url(#arrow-green)" />
    </g>
  </g>

  <!-- LAYER 3: UK SOUTH (FAILOVER) -->
  <g transform="translate(1250, 360)">
    <rect width="610" height="680" class="glass-panel-inactive" />
    <text x="40" y="50" class="font-region" style="fill:#64748B;">Region B: UK South</text>
    <text x="320" y="50" class="font-desc" style="text-anchor:start;">Passive / Failover</text>
    
    <g transform="translate(80, 250)">
        <text x="225" y="0" class="font-label" style="font-size:32px; fill:#475569;">STANDBY REPLICA</text>
        <text x="225" y="40" class="font-desc">Infrastructure Deployed &amp; Synced</text>
        <text x="225" y="70" class="font-desc">Traffic Manager Probe: 200 OK</text>
    </g>
  </g>
  
  <!-- Ingress Line Connecting top to Region A -->
  <path d="M510,320 L510,480" class="flow" style="display:none;" /> <!-- Logical connection via stacking -->

</svg>
