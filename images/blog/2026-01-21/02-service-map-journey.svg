<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      /* Dark Mode Typography */
      .title { font: 800 42px 'Outfit', 'Segoe UI', sans-serif; fill: #F8FAFC; text-shadow: 0 2px 20px rgba(0,0,0,0.8); letter-spacing: -0.02em; }
      .subtitle { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; letter-spacing: 0.01em; }
      
      /* Swimlane Headers */
      .h2 { font: 700 24px 'Outfit', 'Segoe UI', sans-serif; fill: #E2E8F0; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.9; }
      
      /* Card Text */
      .small { font: 600 18px 'Inter', 'Segoe UI', sans-serif; fill: #F1F5F9; }
      .note { font: 400 15px 'Inter', 'Segoe UI', sans-serif; fill: #CBD5E1; }
      
      /* Glassmorphism Containers */
      /* Swimlanes - Barely visible glass sheets */
      .box2 { 
        fill: rgba(255, 255, 255, 0.02); 
        stroke: rgba(255, 255, 255, 0.08); 
        stroke-width: 1; 
        rx: 12; ry: 12; 
      }
      
      /* Action Cards - Deep blue glass with Cyan/Blue glow */
      .box { 
        fill: rgba(15, 23, 42, 0.6); 
        stroke: #38BDF8; 
        stroke-width: 2; 
        rx: 12; ry: 12; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); 
      }
      
      /* Accent Cards (Regulator/Security) - Purple tint */
      .accent { 
        fill: rgba(168, 85, 247, 0.1); 
        stroke: #A855F7; 
        stroke-width: 2; 
        stroke-dasharray: 4 4;
        rx: 12; ry: 12; 
      }
      
      /* Connectors */
      .line { stroke: #64748B; stroke-width: 2; fill: none; opacity: 0.6; }
      .arrow { marker-end: url(#arrow); }
      
      /* Footer */
      .footer-note { font: 400 14px 'Inter', sans-serif; fill: #64748B; font-style: italic; }
    </style>
    
    <!-- Arrowhead Marker -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 L2,2" fill="#64748B" />
    </marker>
    
    <!-- Background Glow (Optional) -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(56, 189, 248, 0.05)" />
      <stop offset="100%" style="stop-color:rgba(15, 23, 42, 0)" />
    </radialGradient>
  </defs>

  <!-- Ambient Background Glow -->
  <circle cx="960" cy="540" r="800" fill="url(#glow)" />

  <!-- Header -->
  <text x="60" y="80" class="title" text-anchor="start">Service Map Journey</text>
  <text x="60" y="120" class="subtitle" text-anchor="start">From user intent to regulated evidence • <tspan fill="#38BDF8" font-weight="600">TOGAF Service View</tspan></text>

  <!-- Swimlanes -->
  <!-- Business -->
  <rect x="60" y="170" width="1800" height="180" class="box2"/>
  <text x="90" y="215" class="h2" text-anchor="start">Business Canvas</text>
  
  <!-- Platform -->
  <rect x="60" y="390" width="1800" height="180" class="box2"/>
  <text x="90" y="435" class="h2" text-anchor="start">AI Platform Services</text>
  
  <!-- Security -->
  <rect x="60" y="610" width="1800" height="180" class="box2"/>
  <text x="90" y="655" class="h2" text-anchor="start">Security &amp; Controls</text>
  
  <!-- Operations -->
  <rect x="60" y="830" width="1800" height="100" class="box2"/>
  <text x="90" y="875" class="h2" text-anchor="start">Day-2 Operations</text>

  <!-- Process Flow Nodes (Center Lane) -->
  <!-- 1. Ask -->
  <rect x="160" y="430" width="250" height="110" class="box"/>
  <text x="285.0" y="465" class="small" text-anchor="middle">1. Ask / Submit</text>
  <text x="285.0" y="495" class="note" text-anchor="middle">User intent captured</text>
  <text x="285.0" y="515" class="note" text-anchor="middle">(Chat or Doc)</text>

  <!-- 2. Gate -->
  <rect x="450" y="430" width="250" height="110" class="box"/>
  <text x="575.0" y="465" class="small" text-anchor="middle">2. Gate &amp; Identify</text>
  <text x="575.0" y="495" class="note" text-anchor="middle">Zscaler + Entra ID</text>
  <text x="575.0" y="515" class="note" text-anchor="middle">Device Context</text>

  <!-- 3. Decide -->
  <rect x="740" y="430" width="250" height="110" class="box"/>
  <text x="865.0" y="465" class="small" text-anchor="middle">3. Decide &amp; Route</text>
  <text x="865.0" y="495" class="note" text-anchor="middle">APIM + WAF</text>
  <text x="865.0" y="515" class="note" text-anchor="middle">Smart Load Balancing</text>

  <!-- 4. Retrieve -->
  <rect x="1030" y="430" width="250" height="110" class="box"/>
  <text x="1155.0" y="465" class="small" text-anchor="middle">4. Retrieve</text>
  <text x="1155.0" y="495" class="note" text-anchor="middle">AI Search (Hybrid)</text>
  <text x="1155.0" y="515" class="note" text-anchor="middle">Semantic Ranking</text>

  <!-- 5. Generate -->
  <rect x="1320" y="430" width="250" height="110" class="box"/>
  <text x="1445.0" y="465" class="small" text-anchor="middle">5. Generate</text>
  <text x="1445.0" y="495" class="note" text-anchor="middle">Azure OpenAI (PTU)</text>
  <text x="1445.0" y="515" class="note" text-anchor="middle">Regional Mesh</text>

  <!-- 6. Evidence -->
  <rect x="1610" y="430" width="250" height="110" class="box"/>
  <text x="1735.0" y="465" class="small" text-anchor="middle">6. Evidence</text>
  <text x="1735.0" y="495" class="note" text-anchor="middle">Trace + Log</text>
  <text x="1735.0" y="515" class="note" text-anchor="middle">Compliance Record</text>

  <!-- Connecting Arrows -->
  <line x1="410" y1="485" x2="450" y2="485" class="line arrow"/>
  <line x1="700" y1="485" x2="740" y2="485" class="line arrow"/>
  <line x1="990" y1="485" x2="1030" y2="485" class="line arrow"/>
  <line x1="1280" y1="485" x2="1320" y2="485" class="line arrow"/>
  <line x1="1570" y1="485" x2="1610" y2="485" class="line arrow"/>

  <!-- Vertical Overlays -->
  <!-- Regulator -->
  <rect x="160" y="210" width="250" height="110" class="accent"/>
  <text x="285.0" y="255" class="small" text-anchor="middle" fill="#A855F7">Regulator View</text>
  <text x="285.0" y="285" class="note" text-anchor="middle">Safe answers +</text>
  <text x="285.0" y="305" class="note" text-anchor="middle">Citations req.</text>
  <line x1="285.0" y1="320" x2="285.0" y2="430" class="line arrow" stroke-dasharray="4 4"/>

  <!-- Identity -->
  <rect x="450" y="650" width="250" height="110" class="accent"/>
  <text x="575.0" y="695" class="small" text-anchor="middle" fill="#A855F7">Zero Trust</text>
  <text x="575.0" y="725" class="note" text-anchor="middle">Conditional Access</text>
  <line x1="575.0" y1="540" x2="575.0" y2="650" class="line arrow" stroke-dasharray="4 4"/>

  <!-- Network -->
  <rect x="740" y="650" width="250" height="110" class="accent"/>
  <text x="865.0" y="695" class="small" text-anchor="middle" fill="#A855F7">Network Security</text>
  <text x="865.0" y="725" class="note" text-anchor="middle">WAF Policies</text>
  <line x1="865.0" y1="540" x2="865.0" y2="650" class="line arrow" stroke-dasharray="4 4"/>

  <!-- Audit -->
  <rect x="1610" y="650" width="250" height="110" class="accent"/>
  <text x="1735.0" y="695" class="small" text-anchor="middle" fill="#A855F7">Audit Pack</text>
  <text x="1735.0" y="725" class="note" text-anchor="middle">Full Trajectory</text>
  <line x1="1735.0" y1="540" x2="1735.0" y2="650" class="line arrow" stroke-dasharray="4 4"/>

  <!-- Footer Ops Bar -->
  <text x="90" y="905" class="footer-note" text-anchor="start">Continuous Assurance: IaC + CI/CD + Policy-as-Code + Observability enforced across every step.</text>

</svg>
