<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      /* Typography */
      .font-header { font: 800 48px 'Outfit', 'Segoe UI', sans-serif; fill: #F8FAFC; letter-spacing: -0.02em; }
      .font-sub { font: 400 24px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      
      .font-h2 { font: 700 32px 'Outfit', 'Segoe UI', sans-serif; }
      .font-note { font: 400 18px 'Inter', 'Segoe UI', sans-serif; fill: #94A3B8; }
      .font-label { font: 600 20px 'Outfit', 'Segoe UI', sans-serif; fill: #E2E8F0; }
      .font-metric { font: 700 36px 'Outfit', 'Segoe UI', sans-serif; }
      
      /* Panels */
      .panel-tpm { 
        fill: rgba(15, 23, 42, 0.4); 
        stroke: rgba(245, 158, 11, 0.3); /* Amber border */
        stroke-width: 2; 
        rx: 16; ry: 16;
      }
      .panel-ptu { 
        fill: rgba(15, 23, 42, 0.6); 
        stroke: rgba(168, 85, 247, 0.5); /* Purple border */
        stroke-width: 2; 
        rx: 16; ry: 16;
      }
      
      /* Chart Elements */
      .chart-bg { fill: rgba(255,255,255,0.05); rx: 8; }
      .line-spiky { fill: none; stroke: #F59E0B; stroke-width: 3; }
      .line-flat { fill: none; stroke: #A855F7; stroke-width: 3; }
      
      .tag { rx: 4; }

    </style>
    
    <radialGradient id="glow-bg" cx="50%" cy="0%" r="80%">
        <stop offset="0%" style="stop-color:rgba(168, 85, 247, 0.1)"/>
        <stop offset="100%" style="stop-color:rgba(15, 23, 42, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0F172A" />
  <circle cx="960" cy="0" r="1200" fill="url(#glow-bg)" />

  <!-- Header -->
  <text x="100" y="100" class="font-header">The Capacity Choice: Taxi vs. Private Car</text>
  <text x="100" y="140" class="font-sub">Why we use TPM for bursts and PTU for production guarantees</text>

  <!-- ===============================
       LEFT: Taxi / TPM
       =============================== -->
  <g transform="translate(100, 200)">
      <rect width="840" height="780" class="panel-tpm" />
      
      <text x="50" y="80" class="font-h2" fill="#F59E0B">Option A: The Taxi (TPM)</text>
      <text x="50" y="120" class="font-note">"Pay As You Go"</text>
      
      <!-- Visual: Spiky Graph -->
      <g transform="translate(50, 180)">
          <rect width="740" height="200" class="chart-bg" />
          <text x="20" y="30" class="font-label" fill="#F59E0B">Latency Profile: Volatile</text>
          
          <!-- Spiky Line Path -->
          <path d="M0,150 L50,140 L100,60 L150,160 L200,100 L250,180 L300,50 L350,150 L400,130 L450,80 L500,160 L550,120 L600,170 L650,40 L700,150 L740,150" 
                class="line-spiky" transform="translate(0,0)"/>
      </g>
      
      <!-- Feature Stack -->
       <g transform="translate(50, 420)">
         <text x="0" y="0" class="font-label" fill="#E2E8F0">Best For:</text>
         <text x="0" y="35" class="font-note">• Proof of Concepts (PoC)</text>
         <text x="0" y="65" class="font-note">• Irregular Batch Jobs</text>
         <text x="0" y="95" class="font-note">• Dev/Test Environments</text>
         
         <text x="400" y="0" class="font-label" fill="#E2E8F0">Risks:</text>
         <text x="400" y="35" class="font-note">• Noisy Neighbours</text>
         <text x="400" y="65" class="font-note">• Quota Ceilings</text>
         <text x="400" y="95" class="font-note">• Unpredictable Latency</text>
       </g>

       <!-- Big Metric -->
       <g transform="translate(50, 600)">
          <text x="0" y="40" class="font-metric" fill="#F59E0B">~£0 Upfront</text>
          <text x="0" y="70" class="font-note">No commitment required.</text>
       </g>
  </g>

  <!-- ===============================
       RIGHT: Private Car / PTU
       =============================== -->
  <g transform="translate(980, 200)">
      <rect width="840" height="780" class="panel-ptu" />
      
      <text x="50" y="80" class="font-h2" fill="#A855F7">Option B: Private Car (PTU)</text>
      <text x="50" y="120" class="font-note">"Provisioned Throughput"</text>
      
      <!-- Visual: Flat Graph -->
      <g transform="translate(50, 180)">
          <rect width="740" height="200" class="chart-bg" />
          <text x="20" y="30" class="font-label" fill="#A855F7">Latency Profile: Guaranteed</text>
          
          <!-- Flat Line Path -->
          <path d="M0,100 L740,100" class="line-flat" />
          <!-- Dashed limits -->
          <line x1="0" y1="50" x2="740" y2="50" stroke="#A855F7" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
          <text x="730" y="40" text-anchor="end" fill="#A855F7" font-size="12">Reserved Cap</text>
      </g>
      
      <!-- Feature Stack -->
       <g transform="translate(50, 420)">
         <text x="0" y="0" class="font-label" fill="#E2E8F0">Best For:</text>
         <text x="0" y="35" class="font-note">• Production Copilots</text>
         <text x="0" y="65" class="font-note">• Regulated User Journeys</text>
         <text x="0" y="95" class="font-note">• SLA-bound Workloads</text>
         
         <text x="400" y="0" class="font-label" fill="#E2E8F0">Requirements:</text>
         <text x="400" y="35" class="font-note">• Capacity Planning</text>
         <text x="400" y="65" class="font-note">• Commit Spend</text>
         <text x="400" y="95" class="font-note">• Usage Governance</text>
       </g>
       
       <!-- Big Metric -->
       <g transform="translate(50, 600)">
          <text x="0" y="40" class="font-metric" fill="#A855F7">99.9% Stable</text>
          <text x="0" y="70" class="font-note">Latency defined by contract.</text>
       </g>
  </g>

</svg>
