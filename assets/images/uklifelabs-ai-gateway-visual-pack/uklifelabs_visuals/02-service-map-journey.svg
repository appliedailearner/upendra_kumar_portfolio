<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title { font: 700 32px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #444; }
      .h2 { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .text { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #333; }
      .note { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #555; }
      .box { fill: #fff; stroke: #BFC7D5; stroke-width: 2; rx: 18; ry: 18; }
      .box2 { fill: #F7F9FC; stroke: #BFC7D5; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #EAF3FF; stroke: #2B78E4; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #6B7280; stroke-width: 2.5; fill: none; }
      .arrow { marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6B7280" />
    </marker>
  </defs>
<text x="60" y="70" class="title" text-anchor="start">Service Map Journey</text>
<text x="60" y="105" class="subtitle" text-anchor="start">From user intent to regulated evidence, aligned to TOGAF service thinking</text>
<rect x="60" y="170" width="1800" height="180" class="box2"/>
<text x="90" y="210" class="h2" text-anchor="start">Business (Regulatory teams)</text>
<rect x="60" y="390" width="1800" height="180" class="box2"/>
<text x="90" y="430" class="h2" text-anchor="start">Platform (Cloud + AI)</text>
<rect x="60" y="610" width="1800" height="180" class="box2"/>
<text x="90" y="650" class="h2" text-anchor="start">Security (Controls + Audit)</text>
<rect x="60" y="830" width="1800" height="180" class="box2"/>
<text x="90" y="870" class="h2" text-anchor="start">Operations (DevOps + SRE)</text>
<rect x="160" y="430" width="250" height="110" class="box"/>
<text x="285.0" y="465" class="small" text-anchor="middle">1. Ask / Submit</text>
<text x="285.0" y="490" class="note" text-anchor="middle">User asks a question</text>
<text x="285.0" y="512" class="note" text-anchor="middle">or uploads a doc</text>
<rect x="450" y="430" width="250" height="110" class="box"/>
<text x="575.0" y="465" class="small" text-anchor="middle">2. Gate &amp; Identify</text>
<text x="575.0" y="490" class="note" text-anchor="middle">Zscaler + Edge</text>
<text x="575.0" y="512" class="note" text-anchor="middle">controls</text>
<text x="575.0" y="534" class="note" text-anchor="middle">Entra auth, MFA,</text>
<text x="575.0" y="556" class="note" text-anchor="middle">device posture</text>
<rect x="740" y="430" width="250" height="110" class="box"/>
<text x="865.0" y="465" class="small" text-anchor="middle">3. Decide &amp; Route</text>
<text x="865.0" y="490" class="note" text-anchor="middle">Cloudflare + Palo Alto</text>
<text x="865.0" y="512" class="note" text-anchor="middle">+ WAF</text>
<text x="865.0" y="534" class="note" text-anchor="middle">then APIM Product</text>
<text x="865.0" y="556" class="note" text-anchor="middle">policies</text>
<rect x="1030" y="430" width="250" height="110" class="box"/>
<text x="1155.0" y="465" class="small" text-anchor="middle">4. Retrieve</text>
<text x="1155.0" y="490" class="note" text-anchor="middle">AI Search hybrid</text>
<text x="1155.0" y="512" class="note" text-anchor="middle">retrieval</text>
<text x="1155.0" y="534" class="note" text-anchor="middle">chunks, citations</text>
<rect x="1320" y="430" width="250" height="110" class="box"/>
<text x="1445.0" y="465" class="small" text-anchor="middle">5. Generate</text>
<text x="1445.0" y="490" class="note" text-anchor="middle">Azure OpenAI regional</text>
<text x="1445.0" y="512" class="note" text-anchor="middle">deployment</text>
<text x="1445.0" y="534" class="note" text-anchor="middle">TPM or PTU</text>
<rect x="1610" y="430" width="250" height="110" class="box"/>
<text x="1735.0" y="465" class="small" text-anchor="middle">6. Evidence</text>
<text x="1735.0" y="490" class="note" text-anchor="middle">Logs, requestId,</text>
<text x="1735.0" y="512" class="note" text-anchor="middle">chunkIds,</text>
<text x="1735.0" y="534" class="note" text-anchor="middle">policy decision,</text>
<text x="1735.0" y="556" class="note" text-anchor="middle">modelId</text>
<rect x="160" y="210" width="250" height="110" class="accent"/>
<text x="285.0" y="245" class="small" text-anchor="middle">Regulator / Analyst</text>
<text x="285.0" y="270" class="note" text-anchor="middle">Needs safe answers
with citations</text>
<line x1="285.0" y1="320" x2="285.0" y2="430" class="line arrow"/>
<rect x="450" y="650" width="250" height="110" class="accent"/>
<text x="575.0" y="705" class="small" text-anchor="middle">Identity + Conditional Access</text>
<line x1="575.0" y1="540" x2="575.0" y2="650" class="line arrow"/>
<rect x="740" y="650" width="250" height="110" class="accent"/>
<text x="865.0" y="705" class="small" text-anchor="middle">WAF + Firewall policy</text>
<line x1="865.0" y1="540" x2="865.0" y2="650" class="line arrow"/>
<rect x="1610" y="650" width="250" height="110" class="accent"/>
<text x="1735.0" y="705" class="small" text-anchor="middle">Audit pack (logs + traces)</text>
<line x1="1735.0" y1="540" x2="1735.0" y2="650" class="line arrow"/>
<rect x="60" y="1000" width="1800" height="60" class="box2"/>
<text x="90" y="1038" class="note" text-anchor="start">Ops overlay: IaC + CI/CD + Policy-as-Code + Observability are enforced across every step.</text>
<line x1="410" y1="485" x2="450" y2="485" class="line arrow"/>
<line x1="700" y1="485" x2="740" y2="485" class="line arrow"/>
<line x1="990" y1="485" x2="1030" y2="485" class="line arrow"/>
<line x1="1280" y1="485" x2="1320" y2="485" class="line arrow"/>
<line x1="1570" y1="485" x2="1610" y2="485" class="line arrow"/>
</svg>
